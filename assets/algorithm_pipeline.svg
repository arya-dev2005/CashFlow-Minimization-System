<svg width="1200" height="500" viewBox="0 0 1200 500" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#111827"/><stop offset="1" stop-color="#0f172a"/></linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000" flood-opacity="0.3"/></filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="11" refY="4" orient="auto"><path d="M0,0 L0,8 L12,4 z" fill="#60a5fa"/></marker>
    <style>.title{font:800 32px Inter,Segoe UI,Arial;fill:#f8fafc}.box{fill:#1e293b;stroke:#475569;stroke-width:1.2;rx:22;filter:url(#shadow)}.h{font:800 20px Inter,Segoe UI,Arial;fill:#f8fafc;text-anchor:middle}.p{font:500 14px Inter,Segoe UI,Arial;fill:#cbd5e1;text-anchor:middle}.arrow{stroke:#60a5fa;stroke-width:4;marker-end:url(#arrow)}.code{font:700 15px Consolas,monospace;fill:#fde68a;text-anchor:middle}</style>
  </defs>
  <rect width="1200" height="500" fill="url(#bg)"/>
  <text x="600" y="55" class="title" text-anchor="middle">Cash Flow Minimization Pipeline</text>
  <g transform="translate(55,130)"><rect width="190" height="180" class="box"/><text x="95" y="43" class="h">1. Input Graph</text><text x="95" y="82" class="p">People are nodes</text><text x="95" y="110" class="p">Debts are directed edges</text><text x="95" y="145" class="code">A → B : ₹100</text></g>
  <line x1="260" y1="220" x2="325" y2="220" class="arrow"/>
  <g transform="translate(340,130)"><rect width="190" height="180" class="box"/><text x="95" y="43" class="h">2. Net Balance</text><text x="95" y="82" class="p">credit - debit</text><text x="95" y="116" class="code">+ = creditor</text><text x="95" y="145" class="code">- = debtor</text></g>
  <line x1="545" y1="220" x2="610" y2="220" class="arrow"/>
  <g transform="translate(625,130)"><rect width="190" height="180" class="box"/><text x="95" y="43" class="h">3. Build Heaps</text><text x="95" y="82" class="p">Max creditor heap</text><text x="95" y="110" class="p">Max debtor heap</text><text x="95" y="145" class="code">priority_queue</text></g>
  <line x1="830" y1="220" x2="895" y2="220" class="arrow"/>
  <g transform="translate(910,130)"><rect width="230" height="180" class="box"/><text x="115" y="43" class="h">4. Greedy Match</text><text x="115" y="82" class="p">Largest debtor pays</text><text x="115" y="110" class="p">largest creditor</text><text x="115" y="145" class="code">min(debt, credit)</text></g>
  <text x="600" y="405" class="p" style="font-size:18px">Repeat until both heaps are empty. Zero balances are skipped automatically.</text>
</svg>
