<svg width="1100" height="650" viewBox="0 0 1100 650" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0f172a"/><stop offset="1" stop-color="#111827"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#000" flood-opacity="0.35"/></filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#38bdf8"/></marker>
    <style>
      .title{font:700 34px Inter,Segoe UI,Arial;fill:#f8fafc}.sub{font:500 16px Inter,Segoe UI,Arial;fill:#cbd5e1}.node{filter:url(#shadow)}.label{font:700 18px Inter,Segoe UI,Arial;fill:#f8fafc;text-anchor:middle}.small{font:600 13px Inter,Segoe UI,Arial;fill:#cbd5e1;text-anchor:middle}.edge{stroke:#38bdf8;stroke-width:3;fill:none;marker-end:url(#arrow);opacity:.9}.amount{font:700 15px Inter,Segoe UI,Arial;fill:#fde68a;text-anchor:middle}.card{fill:#1e293b;stroke:#334155;stroke-width:1.2;rx:18;filter:url(#shadow)}
    </style>
  </defs>
  <rect width="1100" height="650" fill="url(#bg)"/>
  <text x="550" y="55" class="title" text-anchor="middle">Real-World Debt Network: Weekend Trip Settlement</text>
  <text x="550" y="84" class="sub" text-anchor="middle">Raw expenses form a dense directed graph. The optimizer compresses it into fewer final payments.</text>

  <path class="edge" d="M252 180 C385 95, 510 95, 640 180"/><text class="amount" x="447" y="116">₹1,200</text>
  <path class="edge" d="M708 218 C835 255, 870 345, 798 454"/><text class="amount" x="853" y="335">₹700</text>
  <path class="edge" d="M720 488 C580 575, 420 575, 285 488"/><text class="amount" x="505" y="575">₹950</text>
  <path class="edge" d="M222 450 C135 335, 145 245, 215 204"/><text class="amount" x="143" y="328">₹500</text>
  <path class="edge" d="M285 205 C390 280, 505 300, 635 225"/><text class="amount" x="468" y="279">₹650</text>
  <path class="edge" d="M297 452 C410 385, 530 374, 673 452"/><text class="amount" x="492" y="407">₹400</text>
  <path class="edge" d="M648 205 C505 310, 410 360, 275 455"/><text class="amount" x="463" y="350">₹300</text>
  <path class="edge" d="M755 458 C705 340, 665 275, 670 225"/><text class="amount" x="731" y="342">₹250</text>

  <g class="node"><circle cx="235" cy="185" r="55" fill="#ef4444"/><text x="235" y="181" class="label">Aarav</text><text x="235" y="205" class="small">Food + Fuel</text></g>
  <g class="node"><circle cx="690" cy="185" r="55" fill="#22c55e"/><text x="690" y="181" class="label">Meera</text><text x="690" y="205" class="small">Hotel</text></g>
  <g class="node"><circle cx="770" cy="475" r="55" fill="#8b5cf6"/><text x="770" y="471" class="label">Kabir</text><text x="770" y="495" class="small">Tickets</text></g>
  <g class="node"><circle cx="245" cy="475" r="55" fill="#f97316"/><text x="245" y="471" class="label">Riya</text><text x="245" y="495" class="small">Activities</text></g>

  <rect x="820" y="95" width="230" height="110" class="card"/>
  <text x="935" y="128" class="sub" text-anchor="middle">Graph Interpretation</text>
  <text x="845" y="160" class="sub">Node = person</text>
  <text x="845" y="185" class="sub">Edge = owes money</text>
</svg>
